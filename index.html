<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14251f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Djupt under">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Djupt under — Bortom Nattporten</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main id="expedition">
    <canvas id="game" tabindex="0" aria-label="Håll ett finger eller musen i den riktning du vill gå och gräva. Använd ett andra finger för borr och bloss. Piltangenter och WASD fungerar också."></canvas>
    <div class="hud" id="hud">
      <div class="location"><span class="eyebrow" id="biome">ROTDJUPET</span><strong id="depth">0m</strong><span id="hearts" aria-label="5 hjärtan">♥ ♥ ♥ ♥ ♥</span></div>
      <div class="mission"><span id="relics" aria-label="0 av 3 reliker">◇◇◇</span><span id="objective">Hitta den första reliken</span></div>
      <div class="haul"><span class="eyebrow">I DIN RYGGSÄCK</span><strong>◆ <span id="gems">0</span></strong><span id="combo"></span></div>
      <button id="pause" class="icon-button" aria-label="Pausa spelet" title="Pausa (P)">Ⅱ</button>
    </div>
    <div id="threat" class="threat hidden" role="status">Något hörde dig. Fortsätt röra dig.</div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="chapter" class="chapter"><small>DJUPARE IN I DET OKÄNDA</small><strong></strong></div>
    <div class="map-wrap" id="map-wrap"><canvas id="map" width="116" height="192" aria-label="Karta över den här världens utforskade tunnlar, upptäckta reliker, Nattporten och din plats"></canvas><span id="map-caption">GROTTORNA · ◇ RELIK</span></div>
    <div class="bottom-left"><button id="map-toggle" aria-label="Visa eller dölj grottkartan" aria-pressed="true">Karta <kbd>M</kbd></button><button id="sound" aria-label="Slå på ljudet" aria-pressed="false">Ljud av</button></div>
    <div id="hint" class="hint">Håll för att gå och gräva <span>·</span> Använd ett andra finger för verktyg</div>
    <div class="actions">
      <button id="bank" class="bank hidden">↑ Säkra fynden <small>ÅTERVÄND TILL LÄGRET</small></button>
      <button id="drill" class="tool drill"><span class="tool-icon">↯</span><span>Turboborra<small id="drill-label">REDO</small></span><span class="recharge" id="recharge"></span></button>
      <button id="flare" class="tool"><span class="tool-icon">✦</span><span>Bloss <b id="flare-count">3</b><small>SKINGRA MÖRKRET · F</small></span></button>
    </div>
    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title"><section id="panel" class="panel"></section></div>
  </main>
  <template id="install-template">
    <details class="install-help">
      <summary>Lägg till på hemskärmen</summary>
      <button class="install-button" type="button" hidden>Installera Djupt under</button>
      <p><strong>iPhone och iPad</strong> · Öppna spelet i Safari.</p>
      <ol>
        <li>Tryck på <strong>Dela</strong> <svg class="share-icon" viewBox="0 0 24 24" role="img" aria-label="fyrkant med pil uppåt"><path d="M8 9H5v12h14V9h-3M12 15V2m-4 4 4-4 4 4"/></svg>, ibland via sidmenyn.</li>
        <li>Välj <strong>Lägg till på hemskärmen</strong>.</li>
        <li>Låt <strong>Öppna som webbapp</strong> vara på om valet visas. Tryck på <strong>Lägg till</strong>.</li>
      </ol>
      <p><strong>Android och Chrome</strong> · Använd installationsknappen ovan om den visas, eller välj <strong>Installera app</strong> / <strong>Lägg till på startskärmen</strong> i webbläsarens meny. På datorn finns installation även vid adressfältet.</p>
      <p>Starta sedan med lyktikonen. Spelet öppnas i ett eget fönster.</p>
      <p class="offline-status" role="status">Ladda spelet med internet för att förbereda spel utan uppkoppling.</p>
      <p>Sparade fynd och uppgraderingar lagras på den här enheten. En pågående expedition sparas inte när appen stängs.</p>
    </details>
  </template>
  <script src="engine.js?v=7"></script>
  <script src="install.js?v=7"></script>
  <script src="game.js?v=7"></script>
</body>
</html>
